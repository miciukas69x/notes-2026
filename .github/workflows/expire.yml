name: expire
on:
  schedule:
    - cron: '2 19 28 8 *'   # 19:02 UTC = 22:02 Lithuania (EEST), 28 Aug
  workflow_dispatch:
permissions:
  contents: write
jobs:
  wipe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git rm -rq 0fcf4d98 || true
          git config user.name gh
          git config user.email gh@users.noreply.github.com
          git commit -qm "expire" || exit 0
          git push
